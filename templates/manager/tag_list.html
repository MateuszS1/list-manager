{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    Tags
    <a href="{% url 'manager:tag-create' %}" class="btn btn-primary link-to-page" style="float: right">
      Add
    </a>
  </h1>

  {% if tag_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for tag in tag_list %}
        <tr>
          <td>
            {{ tag.name }}
          </td>
          <td>
            <a href="{% url 'manager:tag-update' pk=tag.id %}" class="btn btn-secondary link-to-page">
              Update
            </a>
          </td>
          <td>
            <a href="{% url 'manager:tag-delete' pk=tag.id %}" class="btn btn-secondary link-to-page">
              Delete
            </a>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
